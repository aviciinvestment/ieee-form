<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Manager Login - IEEE Registration</title>
    <script>
        (function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
    </script>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <div class="logo-container">
                <img src="logo.svg" alt="IEEE Logo" class="app-logo">
            </div>
            <h2>COMMUNITY MANAGER LOGIN</h2>
            <p class="subtitle">Enter the Gmail authorized by the admin to access the community page</p>

            <form id="managerLoginForm">
                <div class="input-box">
                    <input type="email" id="managerEmail" placeholder="Enter your authorized Gmail" required>
                    <i class='bx bx-envelope'></i>
                </div>
                <button type="submit" id="authBtn" class="btn">Authenticate</button>
            </form>

            <div id="loadingMessage" class="message" style="display: none; margin-top: 20px;">Checking authorization...</div>

            <div class="login-link">
                <a href="login.html">Back to Portal Login</a>
            </div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <i class='bx bx-error-circle' id="modalIcon"></i>
            <h3 id="modalTitle">Alert</h3>
            <p id="modalMessage">Message goes here.</p>
            <button id="modalCloseBtn" class="btn">OK</button>
        </div>
    </div>

    <script src="theme.js"></script>
    <script type="module" src="community-login.js"></script>
</body>
</html>

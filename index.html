<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <script>
        (function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
    </script>
    <link rel="stylesheet" href="style.css">
    <!-- Include Boxicons for icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <div class="logo-container">
                <img src="logo.svg" alt="IEEE Logo" class="app-logo">
            </div>
            <h2>REGISTER</h2>
            <p class="subtitle" style="text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; color: #004A75; text-align: center; margin-bottom: 20px;">IEEE 30 DAYS CHALLENGE</p>
            <form id="registrationForm">
                <div class="row">
                    <div class="col">
                        <div class="input-box" style="margin-bottom:0;">
                            <input type="text" id="firstName" placeholder="First Name" required>
                            <i class='bx bx-user'></i>
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-box" style="margin-bottom:0;">
                            <input type="text" id="lastName" placeholder="Last Name" required>
                            <i class='bx bx-user-circle'></i>
                        </div>
                    </div>
                </div>
                <div class="input-box">
                    <input type="tel" id="phoneNumber" placeholder="Phone Number" required>
                    <i class='bx bx-phone'></i>
                </div>
                <div class="input-box">
                    <select id="techSkill" required>
                        <option value="" disabled selected>Select Tech Track</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Graphic Design">Graphic Design</option>
                        <option value="Project Management">Project Management</option>
                        <option value="Python Programming">Python Programming</option>
                    </select>
                    <i class='bx bx-code-alt'></i>
                </div>
                <div class="input-box">
                    <input type="email" id="gmail" placeholder="Gmail" required>
                    <i class='bx bxl-gmail'></i>
                </div>
                
                <div id="auth-section" class="auth-section" style="margin-bottom: 20px;">
                    <p class="auth-text" id="authStatusText" style="text-align: center;">You must verify your email to submit.</p>
                    <button type="button" id="googleSignInBtn" class="btn btn-google" style="margin: 10px auto; display: flex;">
                        <i class='bx bxl-google'></i> Sign in with Google
                    </button>
                    <p class="auth-text" style="text-align: center;">OR</p>
                    <button type="button" id="magicLinkBtn" class="btn btn-outline" style="margin: 10px auto; display: flex; background: transparent; border: 2px solid #004A75; color: #004A75;">
                        <i class='bx bx-envelope'></i> Send Magic Link
                    </button>
                </div>
                
                <button type="submit" id="submitBtn" class="btn submit-btn" disabled>Register</button>
            </form>
        </div>
        
        <!-- Success Message (Hidden by default) -->
        <div id="successMessage" class="success-message" style="display: none; width: 100%; max-width: 450px;">
            <i class='bx bx-check-circle'></i>
            <h2>Submission Successful!</h2>
            <p>Thank you for registering for the IEEE 30 Days Skill Challenge.</p>
            <p id="redirectInfo" style="margin-top: 10px; font-size: 14px; color: #004A75;"></p>
            <a id="whatsappJoinBtn" href="#" target="_blank" rel="noopener" class="btn" style="display: none;">Join Your WhatsApp Group</a>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <i class='bx bx-error-circle' id="modalIcon"></i>
            <h3 id="modalTitle">Alert</h3>
            <p id="modalMessage">Message goes here.</p>
            <button id="modalCloseBtn" class="btn">OK</button>
        </div>
    </div>

    <script src="theme.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>

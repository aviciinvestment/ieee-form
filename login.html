<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IEEE 30 Days Skill Challenge</title>
    <script>
        (function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
    </script>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <div class="logo-container">
                <img src="logo.svg" alt="IEEE Logo" class="app-logo">
            </div>
            <h2>PORTAL LOGIN</h2>
            <p class="subtitle">Choose your portal to continue</p>

            <a href="community-login.html" class="btn btn-outline">
                <i class='bx bx-user-circle'></i> Community Manager Login
            </a>

            <a href="admin-login.html" class="btn">
                <i class='bx bx-shield-quarter'></i> Admin Login
            </a>

            <div class="login-link">
                <a href="index.html">Back to Registration</a>
            </div>
        </div>
    </div>
    <script src="theme.js"></script>

</html>

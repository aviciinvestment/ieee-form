<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Manager Dashboard - IEEE Registration</title>
    <script>
        (function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
    </script>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="dashboard-wrapper">
            <div class="dashboard-topbar">
                <button type="button" id="menuToggle" class="menu-toggle" aria-label="Menu"><i class='bx bx-menu'></i></button>
                <div class="dashboard-menu" id="dashboardMenu">
                    <a href="index.html" class="nav-link"><i class='bx bx-home'></i> Form</a>
                    <button type="button" id="logoutBtn" class="btn btn-logout"><i class='bx bx-log-out'></i> Logout</button>
                </div>
            </div>
            
            <div class="logo-container">
                <img src="logo.svg" alt="IEEE Logo" class="app-logo">
            </div>
            <h2>COMMUNITY MANAGER</h2>
            <p class="subtitle" id="communityTrackLabel">View participant registrations to engage with the community.</p>
            
            <!-- Main Data Container (Requires Auth) -->
            <div id="dataContainer">
                <div id="loadingMessage" class="message">Loading registrations...</div>
                <div id="errorMessage" class="message" style="display: none; color: #d9534f;"></div>

                <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Phone</th>
                            <th>Tech Skill</th>
                            <th>Email</th>
                            <th>Registration Date</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data will be populated here via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <i class='bx bx-error-circle' id="modalIcon"></i>
            <h3 id="modalTitle">Alert</h3>
            <p id="modalMessage">Message goes here.</p>
            <button id="modalCloseBtn" class="btn">OK</button>
        </div>
    </div>

    <script src="theme.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
